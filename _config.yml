# Site settings. Jekyll does not reload this file while serving: restart it after a change.

title       : "Christopher Marouani"
description : "Christopher Marouani's academic portfolio"
url         : "https://chris-mrn.github.io"
baseurl     : ""

# Shown in the sidebar of every page (_includes/sidebar.html)
author:
  name     : "Christopher Marouani"
  bio      : "Master’s Student in Machine Learning"
  avatar   : "profile.jpg"   # file in images/
  location : "France"
  uri      : "https://chris-mrn.github.io"
  github   : "chris-mrn"
  linkedin : "christopher-marouani-852922245/"

# Pages live in _pages/ and use the "single" layout unless they say otherwise
include:
  - _pages
exclude:
  - local
  - vendor
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - resume.tex
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
